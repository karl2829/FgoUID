<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
/* FGOUID 御主衣服卡 · 与其它卡片同一暗色主题（DARK-CHALDEA FRAME）
   引擎：pytakumi / Skia。禁写：::before/::after、blur、backdrop-filter、clip-path */
:root{
  --bg-top:#17243D; --bg-base:#131E33; --bg-bottom:#0C1524;
  --panel:#1B2A45; --slot:#0F1729;
  --text-1:#F2EDE3; --text-2:#A9B6CC; --text-3:#8B98AE; --text-4:#6C7A90;
  --num:#E8D3A0;
  --gold-hi:#F5E3AE; --gold:#E3C36B; --gold-mid:#C9A227; --gold-dark:#A8862F; --gold-deep:#8A6E1A;
  --metal-ring:linear-gradient(128deg,#6E5620 0%,#C9A227 9%,#F8EDCB 19%,#E8C877 31%,
               #A8862F 47%,#C9A227 63%,#F5E3AE 79%,#8A6E1A 93%,#C9A227 100%);
  --rule:linear-gradient(90deg,rgba(201,162,39,0) 0%,var(--g32) 10%,
         rgba(245,227,174,.42) 50%,var(--g32) 90%,rgba(201,162,39,0) 100%);
  --g06:rgba(201,162,39,.06); --g10:rgba(201,162,39,.10); --g12:rgba(201,162,39,.12);
  --g16:rgba(201,162,39,.16); --g24:rgba(201,162,39,.24); --g32:rgba(201,162,39,.32);
  --g48:rgba(201,162,39,.48); --g60:rgba(201,162,39,.60);
  --ink-34:rgba(11,18,32,.34); --ink-42:rgba(11,18,32,.42); --ink-50:rgba(11,18,32,.50);
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px;
  --pad-x:48px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{padding:40px;font-family:"WenQuanYi Zen Hei","WenQuanYi Micro Hei",sans-serif;
     -webkit-font-smoothing:antialiased;color:var(--text-1);background:#080d15}

.card{width:1080px;padding:1.5px;border-radius:22px;background:var(--metal-ring);
  box-shadow:0 0 0 1px rgba(227,195,107,.16), 0 0 32px rgba(227,195,107,.10),
             0 26px 70px rgba(0,0,0,.66)}
.inner{position:relative;width:100%;border-radius:20.5px;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-base) 46%,var(--bg-bottom) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.08),
             inset 0 -1px 0 rgba(0,0,0,.55);
  display:flex;flex-direction:column}
.top-gloss{position:absolute;left:0;right:0;top:0;height:1.5px;pointer-events:none;z-index:6;
  border-radius:20px 20px 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 20%,
             rgba(255,255,255,.14) 48%,rgba(255,255,255,0) 74%)}
.sheen{position:absolute;left:-10%;right:-10%;top:-14%;height:40%;pointer-events:none;
  background:radial-gradient(112% 70% at 26% -8%,var(--g16),rgba(201,162,39,0) 62%)}
.corner{position:absolute;width:34px;height:34px;z-index:6;pointer-events:none;opacity:.45}
.corner.tl{left:14px;top:14px;border-left:1.5px solid var(--gold);border-top:1.5px solid var(--gold);border-radius:4px 0 0 0}
.corner.tr{right:14px;top:14px;border-right:1.5px solid var(--gold);border-top:1.5px solid var(--gold);border-radius:0 4px 0 0}
.corner.bl{left:14px;bottom:14px;border-left:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);border-radius:0 0 0 4px}
.corner.br{right:14px;bottom:14px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);border-radius:0 0 4px 0}

/* ---------- 头部：衣服图 + 标题 ---------- */
.hd{position:relative;z-index:1;display:flex;align-items:flex-start;gap:var(--sp-3);
  padding:var(--sp-4) var(--pad-x) 0}
.art{flex:0 0 168px;width:168px;height:168px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;overflow:hidden;background:radial-gradient(70% 70% at 50% 45%,var(--g16),var(--g06) 78%);
  box-shadow:inset 0 0 0 1px var(--g48), inset 0 1px 0 rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.45)}
.art img{width:150px;height:150px;object-fit:contain;display:block}
.hd-l{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.eyebrow{font-size:15px;color:var(--text-4);letter-spacing:.20em}
.eyebrow b{color:var(--gold-mid);font-weight:400}
h1{font-size:46px;line-height:1.18;color:var(--text-1);margin-top:12px;letter-spacing:.06em}
.sub{font-size:16px;color:var(--text-3);margin-top:10px;letter-spacing:.03em}
.pill{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;flex:0 0 auto;margin-top:14px;
  padding:8px 13px 9px;border-radius:8px;font-size:14px;letter-spacing:.14em;color:var(--gold-hi);
  background:var(--g10);border:1px solid var(--g48);box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px rgba(245,227,174,.8)}

.rule{height:1px;background:var(--rule);margin:var(--sp-3) var(--pad-x) 0}

/* ---------- 区块标题 ---------- */
.sec-h{display:flex;align-items:center;gap:var(--sp-2);margin:40px var(--pad-x) 0}
.sec-h .bar{width:5px;height:22px;border-radius:2px;background:linear-gradient(180deg,#F8EDCB,#C9A227 52%,#8A6E1A)}
.sec-h .t{font-size:22px;color:var(--gold-hi);letter-spacing:.22em}
.sec-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--g60),rgba(201,162,39,0))}
.sec-h .n{font-size:13px;color:var(--text-4);letter-spacing:.18em}

/* ---------- 技能卡 ---------- */
.skills{display:flex;flex-direction:column;gap:12px;margin:20px var(--pad-x) 0}
.sk{border-radius:14px;border:1px solid rgba(255,255,255,.08);padding:14px 18px 14px;
  background:linear-gradient(180deg,#1E2F4D,#182742);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.45), 0 2px 14px rgba(0,0,0,.35)}
.sk-h{display:flex;align-items:center;gap:12px;padding-bottom:10px;
  border-bottom:1px solid rgba(42,59,96,.85);margin-bottom:10px}
.no{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--gold-hi);background:var(--g12);
  border:1px solid var(--g48)}
.nm{font-size:19px;color:var(--text-1);letter-spacing:.02em}
.sp{flex:1}
.eff{margin-top:12px;font-size:15px;line-height:1.55;color:#E6EAF2}
.eff:first-of-type{margin-top:10px}
.v5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.vc{height:26px;display:flex;align-items:center;justify-content:center;border-radius:5px;
  background:var(--ink-50);border:1px solid rgba(255,255,255,.10);
  color:#D8CDB6;font-size:13px;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.vc.edge{color:var(--gold-hi);border-color:var(--g48);background:var(--g10)}
.vc.dots{color:#5C6B85;background:transparent;border-style:dashed;border-color:rgba(255,255,255,.07);
  box-shadow:none}

/* ---------- 解说 ---------- */
.detail{margin:14px var(--pad-x) 0;padding:16px 20px;border-radius:12px;
  background:var(--ink-34);border:1px solid rgba(255,255,255,.06);
  font-size:14.5px;line-height:1.75;color:var(--text-2);letter-spacing:.02em}

/* ---------- 页脚 ---------- */
.orn{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:var(--sp-1);
  margin:var(--sp-3) var(--pad-x) var(--sp-1)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,39,0),var(--g60))}
.orn i:last-child{background:linear-gradient(90deg,var(--g60),rgba(201,162,39,0))}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);
  box-shadow:0 0 0 3px #131E33, 0 0 0 4px var(--g48), 0 0 12px rgba(227,195,107,.45)}
.foot{position:relative;z-index:1;display:flex;justify-content:center;padding:var(--sp-1) var(--pad-x) var(--sp-3)}
.foot .l1{font-size:13.5px;color:var(--text-4);letter-spacing:.02em}
</style></head><body>
<div class="card"><div class="inner">
<div class="top-gloss"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="sheen"></div>

<header class="hd">
  <div class="art"><img src="../assets/{{ART}}"></div>
  <div class="hd-l">
    <div class="eyebrow">M Y S T I C&nbsp; C O D E&nbsp;&nbsp;／&nbsp;&nbsp;<b>御 主 礼 装</b></div>
    <h1>{{NAME}}</h1>
    <div class="sub">{{SUB}}</div>
    <div class="pill"><i></i>{{BADGE}}</div>
  </div>
</header>

<div class="rule"></div>

<div class="sec-h"><div class="bar"></div><div class="t">持有技能</div>
  <div class="line"></div><div class="n">S K I L L S</div></div>

<div class="skills">
{{SKILLS}}
</div>

<div class="sec-h"><div class="bar"></div><div class="t">说明</div>
  <div class="line"></div><div class="n">N O T E S</div></div>
<div class="detail">{{DETAIL}}</div>

<div class="orn"><i></i><b></b><i></i></div>
<footer class="foot">
  <div class="l1">数据来源　{{SRC}}　｜　版权所有　TYPE-MOON / FGO PROJECT</div>
</footer>
</div></div></body></html>

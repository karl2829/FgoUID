<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
/* FGOUID 列表卡（卡池/活动共用外框）· 与 fgo-wiki card-render 同一暗色主题
   禁写：::before/::after 装饰块、clip-path、filter:blur、backdrop-filter、drop-shadow */
:root{
  --bg-top:#17243D; --bg-base:#131E33; --bg-bottom:#0C1524;
  --text-1:#F2EDE3; --text-2:#A9B6CC; --text-3:#8B98AE;
  --gold-hi:#F5E3AE; --gold:#E3C36B; --gold-mid:#C9A227; --gold-dark:#A8862F; --gold-deep:#8A6E1A;
  --metal-ring:linear-gradient(128deg,#6E5620 0%,#C9A227 9%,#F8EDCB 19%,#E8C877 31%,
               #A8862F 47%,#C9A227 63%,#F5E3AE 79%,#8A6E1A 93%,#C9A227 100%);
  --rule:linear-gradient(90deg,rgba(201,162,39,0) 0%,var(--g32) 10%,
         rgba(245,227,174,.42) 50%,var(--g32) 90%,rgba(201,162,39,0) 100%);

  /* 金色透明度阶梯：收敛散落的 rgba(201,162,39,.xx) */
  --g06:var(--g06); --g10:var(--g10); --g12:var(--g12);
  --g16:var(--g16); --g24:var(--g24); --g32:var(--g32);
  --g48:var(--g48); --g60:var(--g60);
  /* 暗底填充 */
  --ink-34:var(--ink-34); --ink-42:var(--ink-42); --ink-50:var(--ink-50);
  /* 间距阶梯：8 的倍数 */
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px;
  --pad-x:48px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{padding:40px;font-family:"WenQuanYi Zen Hei","WenQuanYi Micro Hei",sans-serif;
     -webkit-font-smoothing:antialiased;color:var(--text-1);background:#080d15}

.card{width:1080px;padding:1.5px;border-radius:22px;background:var(--metal-ring);
  box-shadow:0 0 0 1px rgba(227,195,107,.16), 0 0 32px rgba(227,195,107,.10),
             0 26px 70px rgba(0,0,0,.66)}
.inner{position:relative;width:100%;border-radius:20.5px;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-base) 46%,var(--bg-bottom) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.08),
             inset 0 -1px 0 rgba(0,0,0,.55);display:flex;flex-direction:column}
.top-gloss{position:absolute;left:0;right:0;top:0;height:1.5px;pointer-events:none;z-index:6;
  border-radius:20px 20px 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 20%,
             rgba(255,255,255,.14) 48%,rgba(255,255,255,0) 74%)}
.sheen{position:absolute;left:-10%;right:-10%;top:-14%;height:40%;pointer-events:none;
  background:radial-gradient(112% 70% at 26% -8%,rgba(201,162,39,.15),rgba(201,162,39,0) 62%)}
.corner{position:absolute;width:34px;height:34px;z-index:6;pointer-events:none;opacity:.45}
.corner.tl{left:14px;top:14px;border-left:1.5px solid var(--gold);border-top:1.5px solid var(--gold);border-radius:4px 0 0 0}
.corner.tr{right:14px;top:14px;border-right:1.5px solid var(--gold);border-top:1.5px solid var(--gold);border-radius:0 4px 0 0}
.corner.bl{left:14px;bottom:14px;border-left:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);border-radius:0 0 0 4px}
.corner.br{right:14px;bottom:14px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);border-radius:0 0 4px 0}

/* ---------- 头部 ---------- */
.hd{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;padding:38px var(--pad-x) 0}
.hd-l{display:flex;flex-direction:column}
.eyebrow{font-size:15px;color:#6C7A90;letter-spacing:.20em}
.eyebrow b{color:var(--gold-mid);font-weight:400}
h1{font-size:48px;line-height:1.18;color:var(--text-1);margin-top:var(--sp-2);letter-spacing:.10em;
  text-shadow:0 2px 10px rgba(0,0,0,.55)}
.sub{font-size:17px;color:var(--text-3);margin-top:var(--sp-1);letter-spacing:.03em}
.pill{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-top:6px;
  padding:9px 15px 10px;border-radius:9px;font-size:15px;letter-spacing:.16em;color:var(--gold-hi);
  background:var(--g10);border:1px solid var(--g48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--gold-hi);
  box-shadow:0 0 8px rgba(245,227,174,.8)}

.rule{height:1px;background:var(--rule);margin:24px var(--pad-x) 0}
.stats{display:flex;margin:18px var(--pad-x) 0;border-radius:11px;
  background:var(--ink-42);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stats .st{flex:1 1 0;text-align:center;padding:11px 0 12px;
  border-right:1px solid var(--g16)}
.stats .st:last-child{border-right:0}
.stats .st i{display:block;font-style:normal;font-size:11.5px;color:#7E8CA2;letter-spacing:.20em}
.stats .st b{display:block;font-weight:400;font-size:25px;color:var(--gold-hi);margin-top:3px;
  font-variant-numeric:tabular-nums}

/* ---------- 条目 ---------- */
.list{display:flex;flex-direction:column;gap:12px;margin:var(--sp-3) var(--pad-x) 0}
.g{display:flex;gap:18px;padding:14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#1E2F4D,#182742);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.40),
             0 2px 10px rgba(0,0,0,.30)}
.gb{flex:0 0 288px;width:288px;height:108px;border-radius:9px;overflow:hidden;
  background:#0F1729;box-shadow:inset 0 0 0 1px var(--g32)}
.gb img{display:block;width:288px;height:108px;object-fit:cover}
.gb.empty{display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#6C7A90;letter-spacing:.18em;
  background:linear-gradient(135deg,#101B30,#16233C)}
.gi{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.gn{font-size:21px;line-height:1.34;color:var(--text-1);letter-spacing:.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gm{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-3);letter-spacing:.04em}
.tag{font-size:11.5px;letter-spacing:.12em;color:var(--gold-hi);padding:2px 8px 3px;border-radius:5px;
  background:var(--g12);border:1px solid var(--g48)}
.tag.jp{color:#B9CBE8;background:rgba(120,150,200,.12);border-color:rgba(120,150,200,.40)}
.tag.est{color:#E8B96B;background:rgba(232,185,107,.10);border-color:rgba(232,185,107,.42)}
.gd{font-size:14.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
.gu{font-size:13px;line-height:1.55;color:#8FA0BC;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gu b{color:var(--gold-mid);font-weight:400}

.orn{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;
  margin:24px var(--pad-x) 12px}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,39,0),var(--g60))}
.orn i:last-child{background:linear-gradient(90deg,var(--g60),rgba(201,162,39,0))}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);
  box-shadow:0 0 0 3px #131E33, 0 0 0 4px var(--g60), 0 0 12px rgba(227,195,107,.45)}

.foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;
  gap:20px;padding:10px var(--pad-x) 26px}
.foot .l,.foot .r{display:flex;flex-direction:column;gap:6px}
.foot .r{text-align:right}
.foot div div{font-size:13.5px;color:#6C7A90;letter-spacing:.02em}
.foot .r div{letter-spacing:.06em}

/* ---------- 礼装卡（左图右信息） ---------- */
.ce{display:flex;gap:26px;margin:var(--sp-3) var(--pad-x) 0}
.art{flex:0 0 380px;width:380px;border-radius:14px;overflow:hidden;position:relative;
  background:#0F1729;box-shadow:inset 0 0 0 1px var(--g48),
             0 0 0 4px var(--g10), 0 10px 30px rgba(0,0,0,.45)}
.art img{display:block;width:380px}
.info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px}
.nm{font-size:34px;line-height:1.32;color:var(--text-1);letter-spacing:.02em}
.nmj{font-size:15px;color:#7E8CA2;margin-top:6px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{font-size:13px;letter-spacing:.10em;color:var(--gold-hi);padding:5px 11px 6px;border-radius:6px;
  background:var(--g10);border:1px solid var(--g48)}
.chip.dim{color:#9FB0C8;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16)}
.nums{display:flex;margin-top:6px;border-radius:10px;background:var(--ink-42);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nums .n{flex:1 1 0;text-align:center;padding:10px 0 11px;border-right:1px solid var(--g16)}
.nums .n:last-child{border-right:0}
.nums .n i{display:block;font-style:normal;font-size:11px;color:#7E8CA2;letter-spacing:.18em}
.nums .n b{display:block;font-weight:400;font-size:22px;color:var(--gold-hi);margin-top:3px;
  font-variant-numeric:tabular-nums}
.eff{display:flex;flex-direction:column;gap:var(--sp-1);margin-top:4px}
.ef{padding:13px 16px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#1E2F4D,#182742);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.40)}
.ef .lb{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;color:var(--gold-mid)}
.ef .lb s{text-decoration:none;width:5px;height:5px;transform:rotate(45deg);background:var(--gold)}
.ef .tx{font-size:15.5px;line-height:1.66;color:var(--text-2);margin-top:7px}
</style></head><body>
<div class="card"><div class="inner">
<div class="top-gloss"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="sheen"></div>

<header class="hd">
  <div class="hd-l">
    <div class="eyebrow">{{EYEBROW_LEFT}}&nbsp;&nbsp;／&nbsp;&nbsp;<b>{{EYEBROW_RIGHT}}</b></div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUB}}</div>
  </div>
  <div class="pill"><i></i>{{PILL}}</div>
</header>

<div class="rule"></div>

<div class="ce">
  <div class="art"><img src="../assets/{{ART}}"></div>
  <div class="info">
    <div>
      <div class="nm">{{NAME}}</div>
      <div class="nmj">{{NAME_JP}}</div>
    </div>
    <div class="chips">{{CHIPS}}</div>
    <div class="nums">{{NUMS}}</div>
    <div class="eff">{{EFFS}}</div>
  </div>
</div>

<div class="orn"><i></i><b></b><i></i></div>
<footer class="foot">
  <div class="l1">{{FOOT_L1}}　｜　{{FOOT_L2}}</div>
</footer>
</div></div></body></html>

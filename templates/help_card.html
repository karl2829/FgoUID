<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
/* FGOUID 帮助卡 · 与 fgo-wiki card-render 同一暗色主题（DARK-CHALDEA FRAME）
   引擎：pytakumi / Skia。禁写：::before/::after 装饰块、clip-path、filter:blur、backdrop-filter、drop-shadow */
:root{
  --bg-top:#17243D; --bg-base:#131E33; --bg-bottom:#0C1524;
  --panel:#1B2A45; --slot:#0F1729;
  --text-1:#F2EDE3; --text-2:#A9B6CC; --text-3:#8B98AE; --num:#F0D48A;
  --gold-hi:#F5E3AE; --gold:#E3C36B; --gold-mid:#C9A227; --gold-dark:#A8862F; --gold-deep:#8A6E1A;
  --metal-ring:linear-gradient(128deg,#6E5620 0%,#C9A227 9%,#F8EDCB 19%,#E8C877 31%,
               #A8862F 47%,#C9A227 63%,#F5E3AE 79%,#8A6E1A 93%,#C9A227 100%);
  --rule:linear-gradient(90deg,rgba(201,162,39,0) 0%,var(--g60) 10%,
         rgba(245,227,174,.78) 50%,var(--g60) 90%,rgba(201,162,39,0) 100%);

  /* 金色透明度阶梯：收敛散落的 rgba(201,162,39,.xx) */
  --g06:var(--g06); --g10:var(--g10); --g12:var(--g12);
  --g16:var(--g16); --g24:var(--g24); --g32:var(--g32);
  --g48:var(--g48); --g60:var(--g60);
  /* 暗底填充 */
  --ink-34:var(--ink-34); --ink-42:var(--ink-42); --ink-50:var(--ink-50);
  /* 间距阶梯：8 的倍数 */
  --text-4:#6C7A90;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px;
  --pad-x:48px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{padding:40px;font-family:"WenQuanYi Zen Hei","WenQuanYi Micro Hei",sans-serif;
     -webkit-font-smoothing:antialiased;color:var(--text-1);background:#080d15}

.card{width:1080px;padding:1.5px;border-radius:22px;background:var(--metal-ring);
  box-shadow:0 0 0 1px rgba(227,195,107,.22), 0 0 18px rgba(227,195,107,.30),
             0 0 56px rgba(227,195,107,.16), 0 26px 70px rgba(0,0,0,.66)}
.inner{position:relative;width:100%;border-radius:20.5px;overflow:hidden;
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-base) 46%,var(--bg-bottom) 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.08),
             inset 0 -1px 0 rgba(0,0,0,.55);
  display:flex;flex-direction:column}
.top-gloss{position:absolute;left:0;right:0;top:0;height:1.5px;pointer-events:none;z-index:6;
  border-radius:20px 20px 0 0;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 20%,
             rgba(255,255,255,.14) 48%,rgba(255,255,255,0) 74%)}
.sheen{position:absolute;left:-10%;right:-10%;top:-14%;height:40%;pointer-events:none;
  background:radial-gradient(112% 70% at 26% -8%,rgba(201,162,39,.15),rgba(201,162,39,0) 62%)}
.corner{position:absolute;width:34px;height:34px;z-index:6;pointer-events:none;opacity:.85}
.corner.tl{left:14px;top:14px;border-left:1.5px solid var(--gold);border-top:1.5px solid var(--gold);border-radius:4px 0 0 0}
.corner.tr{right:14px;top:14px;border-right:1.5px solid var(--gold);border-top:1.5px solid var(--gold);border-radius:0 4px 0 0}
.corner.bl{left:14px;bottom:14px;border-left:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);border-radius:0 0 0 4px}
.corner.br{right:14px;bottom:14px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);border-radius:0 0 4px 0}

/* ---------- 头部 ---------- */
.hd{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;
  gap:24px;padding:var(--sp-4) var(--pad-x) 0}
.hd-l{display:flex;flex-direction:column}
.hr-top{display:flex;align-items:center;gap:16px}
.emwrap{width:96px;height:96px;border-radius:50%;flex:0 0 96px;display:flex;
  align-items:center;justify-content:center;
  background:radial-gradient(70% 70% at 50% 45%,var(--g16),rgba(201,162,39,.02) 78%);
  box-shadow:inset 0 0 0 1px var(--g48), inset 0 1px 0 rgba(255,255,255,.10),
             0 0 22px var(--g12)}
.em{width:72px;height:72px;display:block;flex:0 0 72px;opacity:.88}
.eyebrow{font-size:15px;color:var(--text-4, #6C7A90);letter-spacing:.20em}
.eyebrow b{color:var(--gold-mid);font-weight:400}
h1{font-size:52px;line-height:1.18;color:var(--text-1);margin-top:var(--sp-2);letter-spacing:.10em;
  text-shadow:0 2px 10px rgba(0,0,0,.55)}
.sub{font-size:17px;color:var(--text-3);margin-top:var(--sp-1);letter-spacing:.03em}
.pill{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-top:6px;
  padding:9px 15px 10px;border-radius:9px;font-size:15px;letter-spacing:.16em;color:var(--gold-hi);
  background:var(--g10);border:1px solid var(--g48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--gold-hi);
  box-shadow:0 0 8px rgba(245,227,174,.8)}

/* ---------- 数据规模 ---------- */
.rule{height:1px;background:var(--rule);margin:var(--sp-3) var(--pad-x) 0}
/* 数量自适应：bar 贴合内容并居中 */
.statwrap{display:flex;justify-content:center;margin:var(--sp-2) var(--pad-x) 0}
.stats{display:inline-flex;border-radius:11px;
  background:var(--ink-42);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.stats .st{flex:0 0 auto;min-width:150px;text-align:center;padding:12px 28px 13px;
  border-right:1px solid var(--g16)}
.stats .st:last-child{border-right:0}
.stats .st i{display:block;font-style:normal;font-size:11.5px;color:#7E8CA2;letter-spacing:.20em}
.stats .st b{display:block;font-weight:400;font-size:27px;color:var(--gold-hi);margin-top:3px;
  font-variant-numeric:tabular-nums}

/* ---------- 区块标题 ---------- */
.sec-h{display:flex;align-items:center;gap:14px;margin:var(--sp-4) var(--pad-x) 0}
.sec-h .bar{width:5px;height:24px;border-radius:2px;background:linear-gradient(180deg,#F8EDCB,#C9A227 52%,#8A6E1A)}
.sec-h .t{font-size:22px;color:var(--gold-hi);letter-spacing:.22em}
.sec-h .line{flex:1;height:1px;background:linear-gradient(90deg,var(--g60),rgba(201,162,39,0))}
.sec-h .n{font-size:13.5px;color:var(--text-3);letter-spacing:.18em}

/* ---------- 指令行 ---------- */
.cmds{position:relative;z-index:1;margin:20px var(--pad-x) 0;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg,#1E2F4D,#182742);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.40), 0 2px 10px rgba(0,0,0,.30)}
.k{flex:0 0 auto;min-width:180px;max-width:44%;display:flex;align-items:center;justify-content:center;
  padding:var(--sp-1) 20px;border-radius:8px;font-size:17px;letter-spacing:.02em;color:var(--gold-hi);
  background:var(--g12);border:1px solid var(--g48);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.d{flex:1 1 auto;min-width:0;font-size:15.5px;line-height:1.58;color:var(--text-2);letter-spacing:.01em}
.e{flex:0 0 218px;text-align:right;font-size:14px;color:#9AA6BD;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e b{color:var(--text-2);font-weight:400}

/* ---------- 辅助指令（两列） ---------- */
.duo{display:flex;gap:var(--sp-1);margin:var(--sp-2) var(--pad-x) 0}
.duo .row{flex:1 1 0;flex-direction:column;align-items:flex-start;gap:var(--sp-1);padding:14px 18px 15px}
.duo .k{flex:0 0 auto;justify-content:flex-start;padding:7px 16px 8px;font-size:17px}
.duo .d{flex:0 0 auto;font-size:14.5px;line-height:1.5;color:var(--text-3)}

/* ---------- 提示 ---------- */
.notes{margin:var(--sp-2) var(--pad-x) 0;padding:16px 20px 18px;border-radius:12px;
  background:var(--ink-34);border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.notes .nt{display:flex;align-items:baseline;gap:10px;font-size:15px;line-height:1.85;color:var(--text-2)}
.notes .nt i{font-style:normal;flex:0 0 auto;width:18px;text-align:center;font-size:12px;
  color:var(--g60)}
.notes .nt b{color:var(--gold-hi);font-weight:400}
.notes .nt.hl{color:var(--text-1)}

/* ---------- 装饰分隔 ---------- */
.orn{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px;
  margin:var(--sp-3) var(--pad-x) var(--sp-1)}
.orn i{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,162,39,0),var(--g60))}
.orn i:last-child{background:linear-gradient(90deg,var(--g60),rgba(201,162,39,0))}
.orn b{width:7px;height:7px;transform:rotate(45deg);background:var(--gold);
  box-shadow:0 0 0 3px #131E33, 0 0 0 4px var(--g60), 0 0 12px rgba(227,195,107,.45)}

/* ---------- 页脚 ---------- */
.foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
  padding:12px var(--pad-x) 28px}
.foot .l{display:flex;flex-direction:column;gap:7px}
.foot .r{text-align:right;display:flex;flex-direction:column;gap:7px}
.foot div div{font-size:14px;color:#6C7A90;letter-spacing:.02em}
.foot .r div{letter-spacing:.06em}
/* ---------- 三列卡片（未开放项虚线灰字） ---------- */
.wip{flex:0 0 auto;font-size:11.5px;letter-spacing:.18em;color:#9FB0C8;
  padding:3px 9px 4px;border-radius:5px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05)}
.grid{display:flex;gap:12px;margin:20px var(--pad-x) 0}
.gi{flex:1 1 0;min-width:0;padding:13px 16px 13px;border-radius:11px;
  border:1px dashed rgba(255,255,255,.30);background:rgba(11,18,32,.30);
  display:flex;flex-direction:column;gap:6px}
.gi.on{border:1px solid var(--g48);
  background:linear-gradient(180deg,rgba(30,47,77,.78),rgba(24,39,66,.78));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 10px rgba(0,0,0,.25)}
.gi .gk{font-size:16.5px;color:#8FA0BC;letter-spacing:.02em}
.gi.on .gk{color:var(--gold-hi)}
.gi .gd{font-size:13px;line-height:1.52;color:#9AA6BD}
.gi.on .gd{color:var(--text-2)}
.gi .go{font-size:12px;letter-spacing:.10em;color:#7C8CA8;margin-top:1px}
.gi.on .go{color:rgba(201,162,39,.88)}
</style></head><body>
<div class="card"><div class="inner">
<div class="top-gloss"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="sheen"></div>

<header class="hd">
  <div class="hd-l">
    <div class="hr-top">
      <div class="emwrap"><img class="em" src="../assets/emblem.png"></div>
      <div class="eyebrow">{{EYEBROW_LEFT}}&nbsp;&nbsp;／&nbsp;&nbsp;<b>{{EYEBROW_RIGHT}}</b></div>
    </div>
    <h1>{{TITLE}}</h1>
    <div class="sub">{{SUB}}</div>
  </div>
  <div class="pill"><i></i>{{PILL}}</div>
</header>

<div class="rule"></div>
<div class="statwrap"><div class="stats">{{STATS}}</div></div>

{{BODY}}
<div class="orn"><i></i><b></b><i></i></div>
<footer class="foot">
  <div class="l1">{{FOOT_L1}}　｜　{{FOOT_L2}}</div>
</footer>
</div></div></body></html>

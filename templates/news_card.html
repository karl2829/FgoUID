<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
/* FGOUID 官网公告卡（白底黑字，素雅）
   引擎：pytakumi / Skia。禁写：::before/::after、blur、backdrop-filter、clip-path */
:root{
  --paper:#FCFCFA; --paper-2:#F4F4F0; --ink:#16181D; --ink-2:#4A505C; --ink-3:#8A8F99;
  --line:#E3E3DE; --accent:#A6402F; --gold:#9A7B3A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{padding:36px;background:#EDEDE8;
     font-family:"WenQuanYi Zen Hei","WenQuanYi Micro Hei",sans-serif;
     -webkit-font-smoothing:antialiased;color:var(--ink)}

.card{width:1080px;background:var(--paper);border-radius:14px;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.04), 0 18px 44px rgba(0,0,0,.12)}
.inner{position:relative;padding:44px 52px 34px}
.top{position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--accent) 0%,#C86B58 42%,rgba(166,64,47,0) 100%)}

.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.eyebrow{font-size:13px;color:var(--ink-3);letter-spacing:.22em}
.eyebrow b{color:var(--gold);font-weight:400}
.tag{flex:0 0 auto;font-size:13px;letter-spacing:.12em;color:var(--accent);
  padding:5px 11px 6px;border-radius:4px;border:1px solid rgba(166,64,47,.35);background:rgba(166,64,47,.05)}
h1{font-size:34px;line-height:1.32;color:var(--ink);margin-top:16px;letter-spacing:.01em}
.meta{display:flex;gap:20px;margin-top:14px;font-size:14px;color:var(--ink-3);letter-spacing:.03em}
.meta b{color:var(--ink-2);font-weight:400}
.rule{height:1px;background:var(--line);margin:22px 0 0}

.facts{margin-top:18px;border-top:1px solid var(--line)}
.facts .f{display:flex;align-items:baseline;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.facts .f i{flex:0 0 96px;font-style:normal;font-size:14px;color:var(--ink-3);letter-spacing:.06em}
.facts .f b{flex:1 1 auto;font-weight:400;font-size:17px;color:var(--ink);letter-spacing:.01em}
.facts .f b.hl{color:var(--accent)}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.sec .st{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);letter-spacing:.14em}
.sec .st s{width:4px;height:13px;text-decoration:none;background:var(--accent);border-radius:2px}
.items{margin-top:8px}
.items .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);
  font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.items .it:last-child{border-bottom:0}
.items .it i{flex:0 0 20px;font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}
.items .it span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 维护时间主区块 */
.band{display:flex;align-items:baseline;gap:16px;margin-top:22px;padding:18px 20px;
  border-radius:10px;background:var(--paper-2)}
.band .k{flex:0 0 auto;font-size:13px;color:var(--ink-3);letter-spacing:.08em}
.band .d2{flex:0 0 auto;font-size:18px;color:var(--ink-2);letter-spacing:.02em}
.band .v{font-size:34px;color:var(--accent);letter-spacing:.01em;
  font-variant-numeric:tabular-nums}

/* 维护内容 */
.block{margin-top:24px}
.block .bh{display:flex;align-items:baseline;gap:10px}
.block .bh i{flex:0 0 4px;width:4px;height:15px;background:var(--accent);border-radius:2px;
  align-self:center}
.block .bh b{font-weight:400;font-size:19px;color:var(--ink);letter-spacing:.04em}
.block .bh s{text-decoration:none;font-size:12px;color:var(--ink-3);letter-spacing:.10em}
.items{margin-top:6px}
.items .it{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);
  font-size:16px;line-height:1.5;color:var(--ink-2)}
.items .it:last-child{border-bottom:0}
.items .it i{flex:0 0 22px;font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums;
  font-size:15px}
.items .it span{flex:1 1 auto;min-width:0}

/* 维护补偿 */
.comp{margin-top:26px;padding:16px 20px 14px;border-radius:10px;background:var(--paper-2)}
.comp .row{display:flex;align-items:baseline;gap:16px;padding:7px 0}
.comp .row i{flex:0 0 92px;font-style:normal;font-size:14px;color:var(--ink-3);letter-spacing:.06em}
.comp .row b{flex:1 1 auto;font-weight:400;font-size:16.5px;color:var(--ink)}
.comp .row b.hl{font-size:19px;color:var(--accent)}

.body{margin-top:18px;font-size:16px;line-height:1.9;color:var(--ink-2)}
.body .tx{display:block;white-space:normal}
.foot{display:flex;align-items:center;justify-content:space-between;
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.foot .l{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em}
.foot .r{font-size:12.5px;color:var(--gold);letter-spacing:.06em}
</style></head><body>
<div class="card"><div class="inner">
<div class="top"></div>

<div class="hd">
  <div style="min-width:0">
    <div class="eyebrow">F G O U I D&nbsp;&nbsp;／&nbsp;&nbsp;<b>官 网 公 告</b></div>
    <h1>{{TITLE}}</h1>
    <div class="meta">{{META}}</div>
  </div>
  <div class="tag">{{KIND}}</div>
</div>

<div class="rule"></div>

<div class="body">{{SUMMARY}}</div>

{{TIME_BAND}}

{{ITEMS_BLOCK}}

{{COMP_BLOCK}}

<div class="foot">
  <div class="l">{{SOURCE}}</div>
</div>
</div></div></body></html>
